<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
   role="img" aria-label="미니 돔 사우나 예시 그림">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF5"/><stop offset="1" stop-color="#F2EDE2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EDE2"/><stop offset="1" stop-color="#E9E2D2"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#FFF6E4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF6E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="65%" r="60%">
      <stop offset="0" stop-color="#F6DCB4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#F6DCB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0EADC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" fill="url(#wall)"/>
  <rect y="560" width="1600" height="440" fill="url(#floor)"/>
  <line x1="0" y1="560" x2="1600" y2="560" stroke="#DCD2BE" stroke-width="2"/>
  <ellipse cx="800" cy="680" rx="620" ry="330" fill="url(#warm)"/>
  <path d="M 470 710 A 330 204.6 0 0 1 1130 710"
      fill="none" stroke="#C9AE79" stroke-width="2.2" opacity="0.5" stroke-dasharray="none"/><path d="M 416 710 A 384 238.07999999999998 0 0 1 1184 710"
      fill="none" stroke="#C9AE79" stroke-width="1.86" opacity="0.4" stroke-dasharray="10 14"/><path d="M 362 710 A 438 271.56 0 0 1 1238 710"
      fill="none" stroke="#C9AE79" stroke-width="1.52" opacity="0.3" stroke-dasharray="10 14"/><path d="M 308 710 A 492 305.04 0 0 1 1292 710"
      fill="none" stroke="#C9AE79" stroke-width="1.1800000000000002" opacity="0.19999999999999996" stroke-dasharray="10 14"/>

  <!-- 베드 -->
  <rect x="370" y="680" width="860" height="34" rx="17" fill="url(#soft)" stroke="#DCD2BE" stroke-width="2.5"/>
  <rect x="400" y="714" width="800" height="30" fill="#F2EDE2" stroke="#DCD2BE" stroke-width="2"/>
  <line x1="470" y1="744" x2="470" y2="846" stroke="#6E665C" stroke-width="5" opacity=".45"/>
  <line x1="1130" y1="744" x2="1130" y2="846" stroke="#6E665C" stroke-width="5" opacity=".45"/>

  <!-- 돔 본체 -->
  <path d="M 470 680 A 330 250 0 0 1 1130 680 Z"
        fill="#FFFFFF" fill-opacity=".92" stroke="#1B2A4A" stroke-width="4"/>
  <path d="M 550 680 A 250 190 0 0 1 1050 680"
        fill="none" stroke="#DCD2BE" stroke-width="2"/>
  <path d="M 650 680 A 150 116 0 0 1 950 680"
        fill="none" stroke="#DCD2BE" stroke-width="1.6"/>
  <line x1="800" y1="430" x2="800" y2="680" stroke="#DCD2BE" stroke-width="1.6"/>
  <!-- 내부 온열 표시 -->
  <g stroke="#AC8A4C" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round">
    <path d="M 730 616 q 14 -22 0 -44 q -14 -22 0 -44"/>
    <path d="M 800 600 q 14 -26 0 -52 q -14 -26 0 -52"/>
    <path d="M 870 616 q 14 -22 0 -44 q -14 -22 0 -44"/>
  </g>

  <!-- 조작 패널 -->
  <rect x="1180" y="520" width="120" height="160" rx="10" fill="#FFFFFF" stroke="#DCD2BE" stroke-width="2.5"/>
  <rect x="1198" y="540" width="84" height="42" rx="5" fill="#1B2A4A"/>
  <text x="1240" y="568" font-family="Georgia,serif" font-size="20"
        fill="#C9AE79" text-anchor="middle">38°</text>
  <circle cx="1218" cy="616" r="8" fill="none" stroke="#DCD2BE" stroke-width="2"/><circle cx="1240" cy="616" r="8" fill="none" stroke="#DCD2BE" stroke-width="2"/><circle cx="1262" cy="616" r="8" fill="none" stroke="#DCD2BE" stroke-width="2"/>
  <rect x="1200" y="640" width="80" height="8" rx="4" fill="#EFE5D2" stroke="#C9AE79" stroke-width="1.5"/>

  
  <text x="800" y="914" font-family="'Malgun Gothic',sans-serif" font-size="26"
        font-weight="700" fill="#6E665C" text-anchor="middle">미니 돔 사우나</text>
  <text x="800" y="946" font-family="'Malgun Gothic',sans-serif" font-size="15"
        fill="#6E665C" fill-opacity=".6" text-anchor="middle">관리 후 몸을 데우며 마무리합니다</text>
  
  <g>
    <rect x="28" y="28" width="150" height="30" rx="15" fill="#1B2A4A" opacity=".9"/>
    <text x="103" y="48" font-family="'Malgun Gothic',sans-serif" font-size="13" font-weight="700"
          fill="#C9AE79" text-anchor="middle">촬영 전 · 예시 그림</text>
  </g>
  <text x="1566" y="966" font-family="Georgia,'Batang',serif" font-size="30"
        fill="#AC8A4C" fill-opacity=".38" text-anchor="end">溫</text>
</svg>
