<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
   role="img" aria-label="리셉션 예시 그림">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF5"/><stop offset="1" stop-color="#F2EDE2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EDE2"/><stop offset="1" stop-color="#E9E2D2"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#FFF6E4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFF6E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="65%" r="60%">
      <stop offset="0" stop-color="#F6DCB4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#F6DCB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0EADC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" fill="url(#wall)"/>
  <rect y="560" width="1600" height="440" fill="url(#floor)"/>
  <line x1="0" y1="560" x2="1600" y2="560" stroke="#DCD2BE" stroke-width="2"/>
  <ellipse cx="800" cy="40" rx="620" ry="260" fill="url(#lamp)"/>

  <!-- 벽면 로고 -->
  <text x="800" y="250" font-family="Georgia,'Batang',serif" font-size="76" letter-spacing="26"
        fill="#6E665C" fill-opacity=".42" text-anchor="middle">MUKYUL</text>
  <line x1="690" y1="292" x2="910" y2="292" stroke="#C9AE79" stroke-width="2"/>
  <text x="800" y="330" font-family="Georgia,serif" font-size="19" letter-spacing="12"
        fill="#AC8A4C" fill-opacity=".7" text-anchor="middle">SKIN LAB</text>

  <!-- 데스크 -->
  <path d="M 420 610 L 1180 610 L 1240 790 L 360 790 Z"
        fill="url(#soft)" stroke="#DCD2BE" stroke-width="2.5"/>
  <path d="M 420 610 L 1180 610 L 1196 646 L 404 646 Z"
        fill="#FFFFFF" stroke="#DCD2BE" stroke-width="2"/>
  <!-- 데스크 위 소품 -->
  <rect x="900" y="554" width="120" height="58" rx="5" fill="#FFFFFF" stroke="#DCD2BE" stroke-width="2"/>
  <path d="M 540 562 l 18 -74 l 18 74 z" fill="#F2EDE2" stroke="#DCD2BE" stroke-width="2"/>
  <g stroke="#AC8A4C" stroke-width="2.4" fill="none" opacity=".5" stroke-linecap="round">
    <path d="M 558 488 q -34 -46 -10 -84"/><path d="M 558 488 q 30 -42 10 -80"/>
  </g>
  <circle cx="720" cy="582" r="20" fill="none" stroke="#C9AE79" stroke-width="2.5"/>

  <!-- 대기 소파 -->
  <rect x="120" y="680" width="230" height="70" rx="14" fill="#FFFFFF" stroke="#DCD2BE" stroke-width="2.5"/>
  <rect x="120" y="630" width="230" height="60" rx="12" fill="#F2EDE2" stroke="#DCD2BE" stroke-width="2"/>
  <rect x="1310" y="680" width="180" height="70" rx="14" fill="#FFFFFF" stroke="#DCD2BE" stroke-width="2.5"/>
  <rect x="1310" y="630" width="180" height="60" rx="12" fill="#F2EDE2" stroke="#DCD2BE" stroke-width="2"/>

  
  <text x="800" y="914" font-family="'Malgun Gothic',sans-serif" font-size="26"
        font-weight="700" fill="#6E665C" text-anchor="middle">리셉션</text>
  <text x="800" y="946" font-family="'Malgun Gothic',sans-serif" font-size="15"
        fill="#6E665C" fill-opacity=".6" text-anchor="middle">상담과 안내가 이루어지는 첫 공간</text>
  
  <g>
    <rect x="28" y="28" width="150" height="30" rx="15" fill="#1B2A4A" opacity=".9"/>
    <text x="103" y="48" font-family="'Malgun Gothic',sans-serif" font-size="13" font-weight="700"
          fill="#C9AE79" text-anchor="middle">촬영 전 · 예시 그림</text>
  </g>
  <text x="1566" y="966" font-family="Georgia,'Batang',serif" font-size="30"
        fill="#AC8A4C" fill-opacity=".38" text-anchor="end">迎</text>
</svg>
